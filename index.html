<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網文閱歷 - 小說閱讀筆記與備忘錄</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amber: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            800: '#92400e',
                            900: '#78350f',
                        },
                        parchment: {
                            light: '#fbf9f4',
                            card: '#ffffff',
                            dark: '#1e1b18',
                            darkcard: '#2a2622'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            background-color: #f7f5f0;
        }
        .dark body {
            background-color: #1a1816;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-200 transition-colors duration-200 min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-amber-900 text-amber-50 shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-book-bookmark text-2xl text-amber-400"></i>
                <h1 class="text-xl font-bold tracking-wide">網文閱歷 <span class="text-xs font-normal opacity-75 bg-amber-800/80 px-2 py-0.5 rounded-full ml-1">小說備忘與追更</span></h1>
            </div>
            
            <div class="flex items-center space-x-2 sm:space-x-4">
                <!-- Export/Import Buttons -->
                <button onclick="exportData()" class="p-2 text-xs sm:text-sm bg-amber-800 hover:bg-amber-700 rounded-lg transition flex items-center space-x-1" title="導出 JSON 備份">
                    <i class="fa-solid fa-download"></i>
                    <span class="hidden sm:inline">備份</span>
                </button>
                <label class="p-2 text-xs sm:text-sm bg-amber-800 hover:bg-amber-700 rounded-lg transition cursor-pointer flex items-center space-x-1" title="導入 JSON 備份">
                    <i class="fa-solid fa-upload"></i>
                    <span class="hidden sm:inline">還原</span>
                    <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importData(event)">
                </label>
                <!-- Add Novel Button -->
                <button onclick="openModal()" class="bg-amber-500 hover:bg-amber-400 text-amber-950 font-semibold px-3 py-2 rounded-lg transition text-xs sm:text-sm shadow flex items-center space-x-1.5">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span>新增小說</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full">
        
        <!-- Stats Summary Bar -->
        <section class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
            <div class="bg-white dark:bg-zinc-800 p-4 rounded-xl shadow-sm border border-slate-200/60 dark:border-zinc-700/60 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 dark:text-zinc-400 font-medium">收藏總數</p>
                    <p id="statTotal" class="text-2xl font-bold text-slate-900 dark:text-white">0</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-400 flex items-center justify-between justify-center">
                    <i class="fa-solid fa-books text-lg"></i>
                </div>
            </div>
            <div class="bg-white dark:bg-zinc-800 p-4 rounded-xl shadow-sm border border-slate-200/60 dark:border-zinc-700/60 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 dark:text-zinc-400 font-medium">每日追更中</p>
                    <p id="statReading" class="text-2xl font-bold text-emerald-600 dark:text-emerald-400">0</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-400 flex items-center justify-center">
                    <i class="fa-solid fa-fire text-lg"></i>
                </div>
            </div>
            <div class="bg-white dark:bg-zinc-800 p-4 rounded-xl shadow-sm border border-slate-200/60 dark:border-zinc-700/60 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 dark:text-zinc-400 font-medium">養肥待看</p>
                    <p id="statWaiting" class="text-2xl font-bold text-amber-600 dark:text-amber-400">0</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400 flex items-center justify-center">
                    <i class="fa-solid fa-seedling text-lg"></i>
                </div>
            </div>
            <div class="bg-white dark:bg-zinc-800 p-4 rounded-xl shadow-sm border border-slate-200/60 dark:border-zinc-700/60 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 dark:text-zinc-400 font-medium">已看完完結</p>
                    <p id="statCompleted" class="text-2xl font-bold text-blue-600 dark:text-blue-400">0</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-400 flex items-center justify-center">
                    <i class="fa-solid fa-circle-check text-lg"></i>
                </div>
            </div>
        </section>

        <!-- Search, Filter & Controls Panel -->
        <section class="bg-white dark:bg-zinc-800 rounded-xl shadow-sm border border-slate-200/60 dark:border-zinc-700/60 p-4 mb-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                
                <!-- Search Input -->
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="renderApp()" placeholder="搜尋書名、主角、備忘記憶點、作者或標籤..." class="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-800 text-sm">
                </div>

                <!-- Filters & Sorting -->
                <div class="flex flex-wrap items-center gap-2.5">
                    <!-- Status Select -->
                    <select id="statusFilter" onchange="renderApp()" class="px-3 py-2 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-800">
                        <option value="ALL">所有閱讀狀態</option>
                        <option value="追更中">🔥 追更中</option>
                        <option value="養肥中">🌱 養肥中</option>
                        <option value="已完結">✅ 已完結</option>
                        <option value="已棄坑">🛑 已棄坑</option>
                    </select>

                    <!-- Sort By -->
                    <select id="sortBy" onchange="renderApp()" class="px-3 py-2 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-800">
                        <option value="updated">最後更新時間</option>
                        <option value="rating">評分最高</option>
                        <option value="title">書名排序</option>
                    </select>

                    <!-- View Mode Toggle -->
                    <div class="flex bg-slate-100 dark:bg-zinc-900 p-1 rounded-lg border border-slate-200 dark:border-zinc-700">
                        <button id="viewGridBtn" onclick="setViewMode('grid')" class="px-2.5 py-1 text-xs rounded transition font-medium bg-white dark:bg-zinc-800 shadow-sm text-amber-900 dark:text-amber-400">
                            <i class="fa-solid fa-border-all mr-1"></i>卡片
                        </button>
                        <button id="viewListBtn" onclick="setViewMode('list')" class="px-2.5 py-1 text-xs rounded transition font-medium text-slate-600 dark:text-zinc-400 hover:text-slate-900">
                            <i class="fa-solid fa-list-ul mr-1"></i>列表
                        </button>
                    </div>
                </div>
            </div>

            <!-- Category Pills -->
            <div class="flex items-center space-x-2 overflow-x-auto pt-4 border-t border-slate-100 dark:border-zinc-700/50 mt-4 no-scrollbar">
                <span class="text-xs font-semibold text-slate-400 dark:text-zinc-500 whitespace-nowrap mr-1">題材:</span>
                <button onclick="setGenreFilter('ALL')" class="genre-pill px-3 py-1 text-xs rounded-full border border-amber-800 bg-amber-800 text-white font-medium transition whitespace-nowrap" data-genre="ALL">全部</button>
                <button onclick="setGenreFilter('青春甜寵')" class="genre-pill px-3 py-1 text-xs rounded-full border border-slate-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-900 text-slate-700 dark:text-zinc-300 hover:border-amber-800 transition whitespace-nowrap" data-genre="青春甜寵">青春甜寵</button>
                <button onclick="setGenreFilter('重生復仇')" class="genre-pill px-3 py-1 text-xs rounded-full border border-slate-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-900 text-slate-700 dark:text-zinc-300 hover:border-amber-800 transition whitespace-nowrap" data-genre="重生復仇">重生復仇</button>
                <button onclick="setGenreFilter('校園生活')" class="genre-pill px-3 py-1 text-xs rounded-full border border-slate-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-900 text-slate-700 dark:text-zinc-300 hover:border-amber-800 transition whitespace-nowrap" data-genre="校園生活">校園生活</button>
                <button onclick="setGenreFilter('宮斗權臣')" class="genre-pill px-3 py-1 text-xs rounded-full border border-slate-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-900 text-slate-700 dark:text-zinc-300 hover:border-amber-800 transition whitespace-nowrap" data-genre="宮斗權臣">宮斗權臣</button>
                <button onclick="setGenreFilter('科幻末世')" class="genre-pill px-3 py-1 text-xs rounded-full border border-slate-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-900 text-slate-700 dark:text-zinc-300 hover:border-amber-800 transition whitespace-nowrap" data-genre="科幻末世">科幻末世</button>
                <button onclick="setGenreFilter('風水玄學')" class="genre-pill px-3 py-1 text-xs rounded-full border border-slate-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-900 text-slate-700 dark:text-zinc-300 hover:border-amber-800 transition whitespace-nowrap" data-genre="風水玄學">風水玄學</button>
                <button onclick="setGenreFilter('相互救贖')" class="genre-pill px-3 py-1 text-xs rounded-full border border-slate-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-900 text-slate-700 dark:text-zinc-300 hover:border-amber-800 transition whitespace-nowrap" data-genre="相互救贖">相互救贖</button>
                <button onclick="setGenreFilter('醫學治療')" class="genre-pill px-3 py-1 text-xs rounded-full border border-slate-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-900 text-slate-700 dark:text-zinc-300 hover:border-amber-800 transition whitespace-nowrap" data-genre="醫學治療">醫學治療</button>
            </div>
        </section>

        <!-- Novels List / Grid Display -->
        <section id="novelsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Dynamically populated via JS -->
        </section>

        <!-- Empty State Message -->
        <div id="emptyState" class="hidden py-16 text-center">
            <div class="w-16 h-16 bg-slate-200 dark:bg-zinc-800 text-slate-400 dark:text-zinc-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-book-open text-2xl"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-700 dark:text-zinc-300 mb-1">找不到相關的小說記錄</h3>
            <p class="text-sm text-slate-500 dark:text-zinc-500 mb-4">試著切換篩選條件，或點擊上方「新增小說」添加你的第一本書吧！</p>
            <button onclick="resetFilters()" class="text-sm text-amber-800 dark:text-amber-400 underline font-medium">重置所有篩選條件</button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-100 dark:bg-zinc-900 border-t border-slate-200 dark:border-zinc-800 py-4 mt-8 text-center text-xs text-slate-500 dark:text-zinc-500">
        <p>網文閱歷 (Novel Reading Log) &copy; 專為網絡小說愛好者打造的防忘備忘錄</p>
    </footer>

    <!-- ADD/EDIT NOVEL MODAL -->
    <div id="novelModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4 overflow-y-auto">
        <div class="bg-white dark:bg-zinc-800 w-full max-w-2xl rounded-2xl shadow-2xl border border-slate-200 dark:border-zinc-700 overflow-hidden my-8">
            <div class="bg-amber-900 text-amber-50 px-6 py-4 flex items-center justify-between">
                <h3 id="modalTitle" class="font-bold text-lg flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-amber-400"></i>
                    <span>新增小說記錄</span>
                </h3>
                <button onclick="closeModal()" class="text-amber-200 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="novelForm" onsubmit="saveNovel(event)" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                <input type="hidden" id="novelId">

                <!-- AI Auto-Fill Section -->
                <div class="bg-amber-50 dark:bg-amber-950/40 p-3.5 rounded-xl border border-amber-200 dark:border-amber-900/50 mb-2">
                    <label class="block text-xs font-bold text-amber-900 dark:text-amber-400 mb-1 flex items-center justify-between">
                        <span><i class="fa-solid fa-wand-magic-sparkles text-amber-500 mr-1"></i> AI 自動抓取 / 補全資料 (番茄/網文)</span>
                        <span class="font-normal text-amber-700/70 dark:text-amber-400/70 text-[11px]">輸入書名自動產生簡介與資訊</span>
                    </label>
                    <div class="flex gap-2">
                        <input type="text" id="aiSearchTitle" placeholder="請輸入番茄小說或網文書名..." class="flex-1 px-3 py-1.5 bg-white dark:bg-zinc-900 border border-amber-300 dark:border-amber-800 rounded-lg text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none">
                        <button type="button" id="aiFetchBtn" onclick="autoFillNovelWithAI()" class="px-4 py-1.5 bg-amber-600 hover:bg-amber-700 text-white font-medium rounded-lg text-xs transition flex items-center space-x-1 shrink-0">
                            <i class="fa-solid fa-sparkles"></i>
                            <span id="aiFetchBtnText">自動填寫</span>
                        </button>
                    </div>
                    <div id="aiFetchStatus" class="hidden text-xs text-amber-800 dark:text-amber-300 mt-2 flex items-center space-x-2">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        <span>AI 正在聯網檢索番茄小說資料中，請稍候...</span>
                    </div>
                </div>

                <!-- Title & Author -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-zinc-300 mb-1">書名 *</label>
                        <input type="text" id="formTitle" required placeholder="例如：難哄" class="w-full px-3 py-2 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 rounded-lg text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-zinc-300 mb-1">作者</label>
                        <input type="text" id="formAuthor" placeholder="例如：竹已" class="w-full px-3 py-2 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 rounded-lg text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none">
                    </div>
                </div>

                <!-- Genre, Protagonist, Status, Rating -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-zinc-300 mb-1">題材分類</label>
                        <select id="formGenre" class="w-full px-3 py-2 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 rounded-lg text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none">
                            <option value="青春甜寵">青春甜寵</option>
                            <option value="重生復仇">重生復仇</option>
                            <option value="校園生活">校園生活</option>
                            <option value="宮斗權臣">宮斗權臣</option>
                            <option value="科幻末世">科幻末世</option>
                            <option value="風水玄學">風水玄學</option>
                            <option value="相互救贖">相互救贖</option>
                            <option value="醫學治療">醫學治療</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-zinc-300 mb-1">主角姓名</label>
                        <input type="text" id="formProtagonist" placeholder="例如：桑延、溫以凡" class="w-full px-3 py-2 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 rounded-lg text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-zinc-300 mb-1">閱讀狀態</label>
                        <select id="formStatus" class="w-full px-3 py-2 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 rounded-lg text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none">
                            <option value="追更中">🔥 追更中</option>
                            <option value="養肥中">🌱 養肥中</option>
                            <option value="已完結">✅ 已完結</option>
                            <option value="已棄坑">🛑 已棄坑</option>
                        </select>
                    </div>
                </div>

                <!-- Progress & Rating -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-zinc-300 mb-1">閱讀進度</label>
                        <input type="text" id="formProgress" placeholder="例如：第 80 章 (大結局)" class="w-full px-3 py-2 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 rounded-lg text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-zinc-300 mb-1">個人評分 (1-5 星)</label>
                        <div class="flex items-center space-x-2 py-1.5">
                            <input type="range" id="formRating" min="1" max="5" step="0.5" value="4.5" oninput="document.getElementById('ratingDisplay').innerText = this.value" class="w-full accent-amber-600">
                            <span id="ratingDisplay" class="text-sm font-bold text-amber-600 dark:text-amber-400 w-8 text-right">4.5</span>
                            <i class="fa-solid fa-star text-amber-500 text-xs"></i>
                        </div>
                    </div>
                </div>

                <!-- One-sentence Plot Memory -->
                <div>
                    <label class="block text-xs font-bold text-amber-900 dark:text-amber-400 mb-1 flex items-center justify-between">
                        <span>💡 一句話防忘記憶點 (最重要)</span>
                        <span class="font-normal text-slate-400 text-[11px]">讓你一眼想起這本書講啥</span>
                    </label>
                    <input type="text" id="formSummary" required placeholder="女主因夢遊症機緣巧合與高中暗戀對象合租..." class="w-full px-3 py-2 bg-amber-50/50 dark:bg-zinc-900 border border-amber-200 dark:border-amber-900/40 rounded-lg text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none">
                </div>

                <!-- Highlight Plot Nodes -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-zinc-300 mb-1">關鍵劇情備忘 / 大事件歷史</label>
                    <textarea id="formPlotMemory" rows="3" placeholder="用逗號或分行記錄關鍵點：&#10;- 高中誤會解開&#10;- 女主克服心理障礙與男主相認" class="w-full px-3 py-2 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 rounded-lg text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none"></textarea>
                </div>

                <!-- Pros / Cons / Warnings -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-zinc-300 mb-1">讀後感 / 避雷提醒 (毒點/爽點)</label>
                    <textarea id="formNotes" rows="2" placeholder="優點：男主深情專一，互動超甜。" class="w-full px-3 py-2 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 rounded-lg text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none"></textarea>
                </div>

                <!-- Modal Actions -->
                <div class="flex items-center justify-end space-x-3 pt-3 border-t border-slate-100 dark:border-zinc-700">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white transition">取消</button>
                    <button type="submit" class="px-5 py-2 bg-amber-800 hover:bg-amber-900 text-white rounded-lg text-sm font-semibold shadow transition">儲存小說</button>
                </div>
            </form>
        </div>
    </div>

    <!-- DETAIL VIEW DRAWER / MODAL -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-zinc-800 w-full max-w-xl rounded-2xl shadow-2xl border border-slate-200 dark:border-zinc-700 overflow-hidden my-8 max-h-[85vh] flex flex-col">
            <div class="bg-slate-900 text-white p-5 flex items-start justify-between">
                <div>
                    <div class="flex items-center space-x-2 mb-1">
                        <span id="detailGenre" class="text-[11px] font-semibold bg-amber-800 text-amber-100 px-2 py-0.5 rounded-full"></span>
                        <span id="detailStatus" class="text-[11px] font-semibold bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full"></span>
                    </div>
                    <h2 id="detailTitle" class="text-xl font-bold"></h2>
                    <p class="text-xs text-slate-400 mt-0.5">作者: <span id="detailAuthor"></span> | 主角: <span id="detailProtagonist"></span></p>
                </div>
                <button onclick="closeDetailModal()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <div class="p-6 space-y-4 overflow-y-auto flex-1">
                <!-- Score & Progress -->
                <div class="flex items-center justify-between p-3 bg-amber-50 dark:bg-amber-950/30 rounded-xl border border-amber-100 dark:border-amber-900/40">
                    <div>
                        <span class="text-xs text-amber-900/70 dark:text-amber-400/80 block">閱讀進度</span>
                        <span id="detailProgress" class="font-bold text-amber-950 dark:text-amber-200"></span>
                    </div>
                    <div class="text-right">
                        <span class="text-xs text-amber-900/70 dark:text-amber-400/80 block">評分</span>
                        <div class="flex items-center text-amber-500 font-bold">
                            <span id="detailRating" class="mr-1 text-base"></span>
                            <i class="fa-solid fa-star text-xs"></i>
                        </div>
                    </div>
                </div>

                <!-- One sentence summary -->
                <div class="space-y-1">
                    <h4 class="text-xs font-bold text-amber-900 dark:text-amber-400 uppercase tracking-wider">💡 核心防忘記憶點</h4>
                    <p id="detailSummary" class="text-sm bg-slate-50 dark:bg-zinc-900 p-3 rounded-lg border border-slate-200 dark:border-zinc-700/60 leading-relaxed font-medium text-slate-800 dark:text-zinc-200"></p>
                </div>

                <!-- Plot Memories -->
                <div class="space-y-1">
                    <h4 class="text-xs font-bold text-slate-500 dark:text-zinc-400 uppercase tracking-wider">📌 關鍵劇情備忘</h4>
                    <div id="detailPlotMemory" class="text-sm bg-slate-50 dark:bg-zinc-900 p-3 rounded-lg border border-slate-200 dark:border-zinc-700/60 leading-relaxed whitespace-pre-line text-slate-700 dark:text-zinc-300"></div>
                </div>

                <!-- Notes / Warning -->
                <div class="space-y-1">
                    <h4 class="text-xs font-bold text-slate-500 dark:text-zinc-400 uppercase tracking-wider">⚡ 讀後感與避雷提醒</h4>
                    <div id="detailNotes" class="text-sm bg-slate-50 dark:bg-zinc-900 p-3 rounded-lg border border-slate-200 dark:border-zinc-700/60 leading-relaxed whitespace-pre-line text-slate-700 dark:text-zinc-300"></div>
                </div>
            </div>

            <!-- Footer Actions -->
            <div class="bg-slate-50 dark:bg-zinc-900/80 px-6 py-3 border-t border-slate-200 dark:border-zinc-700 flex items-center justify-between">
                <button id="detailDeleteBtn" class="text-xs text-rose-600 dark:text-rose-400 hover:underline flex items-center space-x-1">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>刪除此記錄</span>
                </button>
                <button id="detailEditBtn" class="px-4 py-1.5 bg-amber-800 hover:bg-amber-900 text-white rounded-lg text-xs font-medium transition flex items-center space-x-1">
                    <i class="fa-solid fa-pen"></i>
                    <span>編輯資料</span>
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Sample Initial Data
        const SAMPLE_NOVELS = [
            {
                id: "sample-1",
                title: "難哄",
                author: "竹已",
                genre: "青春甜寵",
                protagonist: "桑延、溫以凡",
                status: "已完結",
                rating: 4.8,
                progress: "全書完結 (第 84 章)",
                summary: "機緣巧合下女主與高中暗戀的對象桑延合租，開啟一段溫馨治癒的同居生活。",
                plotMemory: "1. 高中時期的誤會與錯過。\n2. 發現女主患有夢遊症並溫柔維護。\n3. 求婚與甜蜜番外。",
                notes: "爽點：男主深情專一，對女主呵護備至。\n避雷：無大毒點，偏溫馨甜寵日常。",
                updatedAt: new Date(Date.now() - 86400000 * 2).toISOString()
            },
            {
                id: "sample-2",
                title: "重生後我成了權臣的掌中寶",
                author: "墨香",
                genre: "重生復仇",
                protagonist: "沈妙、謝景行",
                status: "追更中",
                rating: 4.5,
                progress: "第 120 章",
                summary: "前世慘死慘絕人寰，重生回十四歲，看清仇人面目並攜手權臣一路逆襲復仇。",
                plotMemory: "1. 開局撕破偽善親戚假面具。\n2. 與男主在京城密謀算計仇家。\n3. 拯救家族危局。",
                notes: "復仇打臉情節非常流暢爽快。",
                updatedAt: new Date(Date.now() - 3600000 * 5).toISOString()
            },
            {
                id: "sample-3",
                title: "末日樂園",
                author: "須尾俱全",
                genre: "科幻末世",
                protagonist: "林三酒",
                status: "養肥中",
                rating: 4.9,
                progress: "第 500 章",
                summary: "極熱地獄、神魔世界等不同末日世界輪番切換，主角憑藉智慧與特殊能力掙扎求生。",
                plotMemory: "1. 開局極熱世界爆發，變異男友叛變。\n2. 副本世界戰鬥與進化。",
                notes: "設定極其龐大，腦洞大開，邏輯嚴密。",
                updatedAt: new Date(Date.now() - 86400000 * 10).toISOString()
            }
        ];

        // State Management
        let novels = [];
        let activeGenreFilter = 'ALL';
        let viewMode = 'grid'; // 'grid' or 'list'

        // Initialize App
        window.onload = function() {
            loadFromLocalStorage();
            renderApp();
        };

        // LocalStorage Management
        function loadFromLocalStorage() {
            const data = localStorage.getItem('novel_tracker_data');
            if (data) {
                try {
                    novels = JSON.parse(data);
                } catch (e) {
                    console.error("Failed to parse stored novels", e);
                    novels = SAMPLE_NOVELS;
                }
            } else {
                novels = SAMPLE_NOVELS;
                saveToLocalStorage();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('novel_tracker_data', JSON.stringify(novels));
        }

        // Render Main UI
        function renderApp() {
            updateStats();
            renderNovels();
        }

        function updateStats() {
            document.getElementById('statTotal').innerText = novels.length;
            document.getElementById('statReading').innerText = novels.filter(n => n.status === '追更中').length;
            document.getElementById('statWaiting').innerText = novels.filter(n => n.status === '養肥中').length;
            document.getElementById('statCompleted').innerText = novels.filter(n => n.status === '已完結').length;
        }

        function setGenreFilter(genre) {
            activeGenreFilter = genre;
            document.querySelectorAll('.genre-pill').forEach(btn => {
                if (btn.dataset.genre === genre) {
                    btn.className = 'genre-pill px-3 py-1 text-xs rounded-full border border-amber-800 bg-amber-800 text-white font-medium transition whitespace-nowrap';
                } else {
                    btn.className = 'genre-pill px-3 py-1 text-xs rounded-full border border-slate-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-900 text-slate-700 dark:text-zinc-300 hover:border-amber-800 transition whitespace-nowrap';
                }
            });
            renderApp();
        }

        function setViewMode(mode) {
            viewMode = mode;
            const gridBtn = document.getElementById('viewGridBtn');
            const listBtn = document.getElementById('viewListBtn');
            const container = document.getElementById('novelsContainer');

            if (mode === 'grid') {
                gridBtn.className = 'px-2.5 py-1 text-xs rounded transition font-medium bg-white dark:bg-zinc-800 shadow-sm text-amber-900 dark:text-amber-400';
                listBtn.className = 'px-2.5 py-1 text-xs rounded transition font-medium text-slate-600 dark:text-zinc-400 hover:text-slate-900';
                container.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5';
            } else {
                listBtn.className = 'px-2.5 py-1 text-xs rounded transition font-medium bg-white dark:bg-zinc-800 shadow-sm text-amber-900 dark:text-amber-400';
                gridBtn.className = 'px-2.5 py-1 text-xs rounded transition font-medium text-slate-600 dark:text-zinc-400 hover:text-slate-900';
                container.className = 'flex flex-col space-y-3';
            }
            renderNovels();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('statusFilter').value = 'ALL';
            setGenreFilter('ALL');
        }

        function getFilteredAndSortedNovels() {
            const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const sortBy = document.getElementById('sortBy').value;

            return novels.filter(novel => {
                // Search match
                const matchSearch = !searchTerm || 
                    novel.title.toLowerCase().includes(searchTerm) ||
                    (novel.author && novel.author.toLowerCase().includes(searchTerm)) ||
                    (novel.protagonist && novel.protagonist.toLowerCase().includes(searchTerm)) ||
                    (novel.summary && novel.summary.toLowerCase().includes(searchTerm)) ||
                    (novel.plotMemory && novel.plotMemory.toLowerCase().includes(searchTerm)) ||
                    (novel.notes && novel.notes.toLowerCase().includes(searchTerm));

                // Genre match
                const matchGenre = activeGenreFilter === 'ALL' || novel.genre === activeGenreFilter;

                // Status match
                const matchStatus = statusFilter === 'ALL' || novel.status === statusFilter;

                return matchSearch && matchGenre && matchStatus;
            }).sort((a, b) => {
                if (sortBy === 'rating') {
                    return b.rating - a.rating;
                } else if (sortBy === 'title') {
                    return a.title.localeCompare(b.title, 'zh-Hant');
                } else {
                    // Default: updated
                    return new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0);
                }
            });
        }

        function renderNovels() {
            const container = document.getElementById('novelsContainer');
            const emptyState = document.getElementById('emptyState');
            const filteredList = getFilteredAndSortedNovels();

            if (filteredList.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            if (viewMode === 'grid') {
                container.innerHTML = filteredList.map(novel => createGridCardHTML(novel)).join('');
            } else {
                container.innerHTML = filteredList.map(novel => createListItemHTML(novel)).join('');
            }
        }

        function getStatusBadgeClass(status) {
            switch(status) {
                case '追更中': return 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800';
                case '養肥中': return 'bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 border-amber-200 dark:border-amber-800';
                case '已完結': return 'bg-blue-100 text-blue-800 dark:bg-blue-950/60 dark:text-blue-300 border-blue-200 dark:border-blue-800';
                case '已棄坑': return 'bg-slate-100 text-slate-600 dark:bg-zinc-800 dark:text-zinc-400 border-slate-200 dark:border-zinc-700';
                default: return 'bg-slate-100 text-slate-800';
            }
        }

        function createGridCardHTML(novel) {
            return `
                <div onclick="openDetailModal('${novel.id}')" class="bg-white dark:bg-zinc-800 rounded-xl border border-slate-200/80 dark:border-zinc-700/80 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between overflow-hidden group">
                    <div class="p-5">
                        <div class="flex items-start justify-between gap-2 mb-2">
                            <span class="text-xs px-2.5 py-0.5 rounded-full font-medium border ${getStatusBadgeClass(novel.status)}">
                                ${novel.status}
                            </span>
                            <div class="flex items-center text-amber-500 font-bold text-xs bg-amber-50 dark:bg-zinc-900 px-2 py-0.5 rounded-md border border-amber-200/60 dark:border-zinc-700">
                                <i class="fa-solid fa-star text-[10px] mr-1"></i>
                                <span>${novel.rating}</span>
                            </div>
                        </div>

                        <h3 class="text-base font-bold text-slate-900 dark:text-white group-hover:text-amber-800 dark:group-hover:text-amber-400 transition line-clamp-1 mb-1">
                            ${escapeHTML(novel.title)}
                        </h3>

                        <div class="text-xs text-slate-500 dark:text-zinc-400 flex items-center space-x-3 mb-3">
                            <span><i class="fa-solid fa-pen-nib mr-1 text-slate-400"></i>${escapeHTML(novel.author || '未知')}</span>
                            <span><i class="fa-solid fa-user-ninja mr-1 text-slate-400"></i>${escapeHTML(novel.protagonist || '未知')}</span>
                            <span class="bg-slate-100 dark:bg-zinc-900 px-1.5 py-0.5 rounded text-[10px]">${escapeHTML(novel.genre)}</span>
                        </div>

                        <!-- One-Sentence Summary Card Highlight -->
                        <div class="bg-amber-50/60 dark:bg-zinc-900/60 border border-amber-100 dark:border-amber-900/30 p-2.5 rounded-lg mb-3">
                            <p class="text-xs text-slate-700 dark:text-zinc-300 line-clamp-2 leading-relaxed">
                                <strong class="text-amber-900 dark:text-amber-400">💡 印象:</strong> ${escapeHTML(novel.summary || '未填寫簡介')}
                            </p>
                        </div>
                    </div>

                    <div class="px-5 py-3 bg-slate-50 dark:bg-zinc-900/50 border-t border-slate-100 dark:border-zinc-700/50 flex items-center justify-between text-xs text-slate-500 dark:text-zinc-400">
                        <span class="truncate max-w-[200px]"><i class="fa-solid fa-bookmark mr-1 text-amber-700 dark:text-amber-500"></i>${escapeHTML(novel.progress || '未記錄')}</span>
                        <span class="text-[11px] text-slate-400"><i class="fa-solid fa-clock mr-1"></i>${formatDate(novel.updatedAt)}</span>
                    </div>
                </div>
            `;
        }

        function createListItemHTML(novel) {
            return `
                <div onclick="openDetailModal('${novel.id}')" class="bg-white dark:bg-zinc-800 p-4 rounded-xl border border-slate-200/80 dark:border-zinc-700/80 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col md:flex-row md:items-center justify-between gap-4 group">
                    <div class="flex-1">
                        <div class="flex flex-wrap items-center gap-2 mb-1">
                            <span class="text-xs px-2 py-0.5 rounded-full font-medium border ${getStatusBadgeClass(novel.status)}">
                                ${novel.status}
                            </span>
                            <span class="bg-slate-100 dark:bg-zinc-900 px-2 py-0.5 rounded text-xs font-medium text-slate-600 dark:text-zinc-400">${escapeHTML(novel.genre)}</span>
                            <h3 class="text-base font-bold text-slate-900 dark:text-white group-hover:text-amber-800 dark:group-hover:text-amber-400 transition">
                                ${escapeHTML(novel.title)}
                            </h3>
                            <span class="text-xs text-slate-400">(${escapeHTML(novel.author || '未知著')})</span>
                        </div>
                        <p class="text-xs text-slate-600 dark:text-zinc-400 line-clamp-1">
                            <span class="font-semibold text-amber-900 dark:text-amber-400">主角: ${escapeHTML(novel.protagonist || '無')}</span> | 
                            💡 ${escapeHTML(novel.summary || '無簡介')}
                        </p>
                    </div>

                    <div class="flex items-center justify-between md:justify-end gap-4 text-xs shrink-0 pt-2 md:pt-0 border-t md:border-t-0 border-slate-100 dark:border-zinc-700">
                        <span class="text-slate-500"><i class="fa-solid fa-bookmark text-amber-700 mr-1"></i>${escapeHTML(novel.progress || '未記')}</span>
                        <div class="flex items-center text-amber-500 font-bold bg-amber-50 dark:bg-zinc-900 px-2 py-1 rounded border border-amber-200/60 dark:border-zinc-700">
                            <i class="fa-solid fa-star text-[10px] mr-1"></i>${novel.rating}
                        </div>
                    </div>
                </div>
            `;
        }

        // Modal Controls & Form Actions
        function openModal(editId = null) {
            const modal = document.getElementById('novelModal');
            const form = document.getElementById('novelForm');
            const titleEl = document.getElementById('modalTitle');

            form.reset();
            document.getElementById('novelId').value = '';
            document.getElementById('ratingDisplay').innerText = '4.5';

            if (editId) {
                const target = novels.find(n => n.id === editId);
                if (target) {
                    titleEl.innerHTML = `<i class="fa-solid fa-pen-to-square text-amber-400"></i><span>編輯小說：${escapeHTML(target.title)}</span>`;
                    document.getElementById('novelId').value = target.id;
                    document.getElementById('formTitle').value = target.title || '';
                    document.getElementById('formAuthor').value = target.author || '';
                    document.getElementById('formGenre').value = target.genre || '青春甜寵';
                    document.getElementById('formProtagonist').value = target.protagonist || '';
                    document.getElementById('formStatus').value = target.status || '追更中';
                    document.getElementById('formProgress').value = target.progress || '';
                    document.getElementById('formRating').value = target.rating || 4.5;
                    document.getElementById('ratingDisplay').innerText = target.rating || 4.5;
                    document.getElementById('formSummary').value = target.summary || '';
                    document.getElementById('formPlotMemory').value = target.plotMemory || '';
                    document.getElementById('formNotes').value = target.notes || '';
                }
            } else {
                titleEl.innerHTML = `<i class="fa-solid fa-plus text-amber-400"></i><span>新增小說記錄</span>`;
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('novelModal').classList.add('hidden');
        }

        function saveNovel(e) {
            e.preventDefault();
            const id = document.getElementById('novelId').value;
            const title = document.getElementById('formTitle').value.trim();
            const author = document.getElementById('formAuthor').value.trim();
            const genre = document.getElementById('formGenre').value;
            const protagonist = document.getElementById('formProtagonist').value.trim();
            const status = document.getElementById('formStatus').value;
            const progress = document.getElementById('formProgress').value.trim();
            const rating = parseFloat(document.getElementById('formRating').value);
            const summary = document.getElementById('formSummary').value.trim();
            const plotMemory = document.getElementById('formPlotMemory').value.trim();
            const notes = document.getElementById('formNotes').value.trim();

            if (!title) return;

            if (id) {
                // Edit existing
                const index = novels.findIndex(n => n.id === id);
                if (index !== -1) {
                    novels[index] = {
                        ...novels[index],
                        title, author, genre, protagonist, status, progress, rating, summary, plotMemory, notes,
                        updatedAt: new Date().toISOString()
                    };
                }
            } else {
                // Add new
                const newNovel = {
                    id: 'novel-' + Date.now(),
                    title, author, genre, protagonist, status, progress, rating, summary, plotMemory, notes,
                    updatedAt: new Date().toISOString()
                };
                novels.unshift(newNovel);
            }

            saveToLocalStorage();
            closeModal();
            closeDetailModal();
            renderApp();
        }

        // Detail View Drawer
        function openDetailModal(id) {
            const novel = novels.find(n => n.id === id);
            if (!novel) return;

            document.getElementById('detailTitle').innerText = novel.title;
            document.getElementById('detailAuthor').innerText = novel.author || '未填寫';
            document.getElementById('detailProtagonist').innerText = novel.protagonist || '未填寫';
            document.getElementById('detailGenre').innerText = novel.genre;
            document.getElementById('detailStatus').innerText = novel.status;
            document.getElementById('detailProgress').innerText = novel.progress || '未記錄進度';
            document.getElementById('detailRating').innerText = novel.rating;

            document.getElementById('detailSummary').innerText = novel.summary || '尚無簡介備忘';
            document.getElementById('detailPlotMemory').innerText = novel.plotMemory || '尚無重大劇情節點記錄';
            document.getElementById('detailNotes').innerText = novel.notes || '尚無讀後感';

            // Buttons
            document.getElementById('detailEditBtn').onclick = () => {
                closeDetailModal();
                openModal(novel.id);
            };

            document.getElementById('detailDeleteBtn').onclick = () => {
                if (confirm(`確定要刪除《${novel.title}》的閱讀記錄嗎？`)) {
                    deleteNovel(novel.id);
                }
            };

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        function deleteNovel(id) {
            novels = novels.filter(n => n.id !== id);
            saveToLocalStorage();
            closeDetailModal();
            renderApp();
        }

        // Export/Import Features
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(novels, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `novel_tracker_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const importedNovels = JSON.parse(e.target.result);
                    if (Array.isArray(importedNovels)) {
                        novels = importedNovels;
                        saveToLocalStorage();
                        renderApp();
                        alert('還原成功！已載入 ' + novels.length + ' 本小說記錄。');
                    } else {
                        alert('無效的 JSON 檔案格式！');
                    }
                } catch (err) {
                    alert('檔案讀取失敗，請確保上傳的是正確的備份 JSON 檔案。');
                }
            };
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0]);
            }
        }

        // Helper Utilities
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Gemini AI Auto-Fill Functionality
        async function autoFillNovelWithAI() {
            const inputTitle = document.getElementById('aiSearchTitle').value.trim() || document.getElementById('formTitle').value.trim();
            if (!inputTitle) {
                alert('請先輸入番茄小說或網文的書名！');
                return;
            }

            const fetchBtn = document.getElementById('aiFetchBtn');
            const btnText = document.getElementById('aiFetchBtnText');
            const statusDiv = document.getElementById('aiFetchStatus');

            // UI Loading State
            fetchBtn.disabled = true;
            btnText.innerText = '抓取中...';
            statusDiv.classList.remove('hidden');

            const systemPrompt = `你是一個專業的網絡小說與番茄小說資料庫助理。請針對使用者提供的網文/番茄小說書名，檢索或推斷小說資料，並根據規定的 JSON 格式輸出。

題材分類只允許從以下8個選項中選擇最符合的一個：
- 青春甜寵
- 重生復仇
- 校園生活
- 宮斗權臣
- 科幻末世
- 風水玄學
- 相互救贖
- 醫學治療

若無法精確對應，請選擇最接近的一個。`;

            const userPrompt = `請查詢並提供網文《${inputTitle}》的詳細資料。`;

            const payload = {
                contents: [{ parts: [{ text: userPrompt }] }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            "title": { "type": "STRING", "description": "完整正確的小說書名" },
                            "author": { "type": "STRING", "description": "作者姓名" },
                            "genre": { 
                                "type": "STRING", 
                                "enum": ["青春甜寵", "重生復仇", "校園生活", "宮斗權臣", "科幻末世", "風水玄學", "相互救贖", "醫學治療"]
                            },
                            "protagonist": { "type": "STRING", "description": "主要主角姓名，用逗號分隔" },
                            "summary": { "type": "STRING", "description": "一句話核心防忘記憶點（約30-60字）" },
                            "plotMemory": { "type": "STRING", "description": "3-5個關鍵劇情節點或大事件歷史，可用分行號列出" },
                            "notes": { "type": "STRING", "description": "優缺點評析與爽點避雷提醒" },
                            "rating": { "type": "NUMBER", "description": "推薦評分 (1.0 - 5.0)" }
                        },
                        required: ["title", "author", "genre", "protagonist", "summary", "plotMemory", "notes", "rating"]
                    }
                }
            };

            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const novelData = JSON.parse(candidate.content.parts[0].text);

                    // Fill into form
                    document.getElementById('formTitle').value = novelData.title || inputTitle;
                    document.getElementById('formAuthor').value = novelData.author || '';
                    if (novelData.genre) {
                        document.getElementById('formGenre').value = novelData.genre;
                    }
                    document.getElementById('formProtagonist').value = novelData.protagonist || '';
                    document.getElementById('formSummary').value = novelData.summary || '';
                    document.getElementById('formPlotMemory').value = novelData.plotMemory || '';
                    document.getElementById('formNotes').value = novelData.notes || '';
                    if (novelData.rating) {
                        const ratingVal = Math.min(5, Math.max(1, parseFloat(novelData.rating)));
                        document.getElementById('formRating').value = ratingVal;
                        document.getElementById('ratingDisplay').innerText = ratingVal;
                    }
                } else {
                    alert('未搜尋到相關小說資料，請確認書名是否正確。');
                }
            } catch (err) {
                console.error('AI 自動抓取失敗:', err);
                alert('AI 獲取小說資料失敗，請重新嘗試或手動填寫。');
            } finally {
                fetchBtn.disabled = false;
                btnText.innerText = '自動填寫';
                statusDiv.classList.add('hidden');
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const now = new Date();
            const diffHours = Math.floor((now - date) / (1000 * 60 * 60));
            
            if (diffHours < 24) {
                return diffHours <= 0 ? '剛剛' : `${diffHours} 小時前`;
            } else if (diffHours < 24 * 7) {
                return `${Math.floor(diffHours / 24)} 天前`;
            }
            return `${date.getMonth() + 1}/${date.getDate()}`;
        }
    </script>
</body>
</html>
