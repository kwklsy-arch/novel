<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網文閱歷 - 小說閱讀筆記與備忘錄</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amber: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            800: '#92400e',
                            900: '#78350f',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            background-color: #f7f5f0;
        }
        .dark body { background-color: #1a1816; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-200 transition-colors duration-200 min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-amber-900 text-amber-50 shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-book-bookmark text-2xl text-amber-400"></i>
                <h1 class="text-xl font-bold tracking-wide">網文閱歷 <span class="text-xs font-normal opacity-75 bg-amber-800/80 px-2 py-0.5 rounded-full ml-1">小說備忘與追更</span></h1>
            </div>
            
            <div class="flex items-center space-x-2 sm:space-x-4">
                <button onclick="exportData()" class="p-2 text-xs sm:text-sm bg-amber-800 hover:bg-amber-700 rounded-lg transition flex items-center space-x-1">
                    <i class="fa-solid fa-download"></i>
                    <span class="hidden sm:inline">備份</span>
                </button>
                <label class="p-2 text-xs sm:text-sm bg-amber-800 hover:bg-amber-700 rounded-lg transition cursor-pointer flex items-center space-x-1">
                    <i class="fa-solid fa-upload"></i>
                    <span class="hidden sm:inline">還原</span>
                    <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importData(event)">
                </label>
                <button onclick="openModal()" class="bg-amber-500 hover:bg-amber-400 text-amber-950 font-semibold px-3 py-2 rounded-lg transition text-xs sm:text-sm shadow flex items-center space-x-1.5">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span>新增小說</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full">
        
        <!-- Stats Summary Bar -->
        <section class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
            <div class="bg-white dark:bg-zinc-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-zinc-700 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 font-medium">收藏總數</p>
                    <p id="statTotal" class="text-2xl font-bold text-slate-900 dark:text-white">0</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-400 flex items-center justify-center">
                    <i class="fa-solid fa-books text-lg"></i>
                </div>
            </div>
            <div class="bg-white dark:bg-zinc-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-zinc-700 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 font-medium">每日追更中</p>
                    <p id="statReading" class="text-2xl font-bold text-emerald-600 dark:text-emerald-400">0</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 flex items-center justify-center">
                    <i class="fa-solid fa-fire text-lg"></i>
                </div>
            </div>
            <div class="bg-white dark:bg-zinc-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-zinc-700 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 font-medium">養肥待看</p>
                    <p id="statWaiting" class="text-2xl font-bold text-amber-600 dark:text-amber-400">0</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-amber-100 dark:bg-amber-900/30 text-amber-700 flex items-center justify-center">
                    <i class="fa-solid fa-seedling text-lg"></i>
                </div>
            </div>
            <div class="bg-white dark:bg-zinc-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-zinc-700 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 font-medium">已看完完結</p>
                    <p id="statCompleted" class="text-2xl font-bold text-blue-600 dark:text-blue-400">0</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-900/40 text-blue-700 flex items-center justify-center">
                    <i class="fa-solid fa-circle-check text-lg"></i>
                </div>
            </div>
        </section>

        <!-- Controls Panel -->
        <section class="bg-white dark:bg-zinc-800 rounded-xl shadow-sm border border-slate-200 dark:border-zinc-700 p-4 mb-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="renderApp()" placeholder="搜尋書名、主角、備忘記憶點、作者或標籤..." class="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-800 text-sm">
                </div>

                <div class="flex flex-wrap items-center gap-2.5">
                    <select id="statusFilter" onchange="renderApp()" class="px-3 py-2 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 rounded-lg text-sm">
                        <option value="ALL">所有閱讀狀態</option>
                        <option value="追更中">🔥 追更中</option>
                        <option value="養肥中">🌱 養肥中</option>
                        <option value="已完結">✅ 已完結</option>
                        <option value="已棄坑">🛑 已棄坑</option>
                    </select>

                    <select id="sortBy" onchange="renderApp()" class="px-3 py-2 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 rounded-lg text-sm">
                        <option value="updated">最後更新時間</option>
                        <option value="rating">評分最高</option>
                        <option value="title">書名排序</option>
                    </select>

                    <div class="flex bg-slate-100 dark:bg-zinc-900 p-1 rounded-lg border border-slate-200 dark:border-zinc-700">
                        <button id="viewGridBtn" onclick="setViewMode('grid')" class="px-2.5 py-1 text-xs rounded font-medium bg-white dark:bg-zinc-800 shadow-sm text-amber-900 dark:text-amber-400">
                            <i class="fa-solid fa-border-all mr-1"></i>卡片
                        </button>
                        <button id="viewListBtn" onclick="setViewMode('list')" class="px-2.5 py-1 text-xs rounded font-medium text-slate-600 dark:text-zinc-400">
                            <i class="fa-solid fa-list-ul mr-1"></i>列表
                        </button>
                    </div>
                </div>
            </div>

            <!-- 8大指定題材 Category Pills -->
            <div class="flex items-center space-x-2 overflow-x-auto pt-4 border-t border-slate-100 dark:border-zinc-700/50 mt-4">
                <span class="text-xs font-semibold text-slate-400 whitespace-nowrap mr-1">題材:</span>
                <button onclick="setGenreFilter('ALL')" class="genre-pill px-3 py-1 text-xs rounded-full border border-amber-800 bg-amber-800 text-white font-medium whitespace-nowrap" data-genre="ALL">全部</button>
                <button onclick="setGenreFilter('青春甜寵')" class="genre-pill px-3 py-1 text-xs rounded-full border border-slate-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-900 text-slate-700 dark:text-zinc-300 whitespace-nowrap" data-genre="青春甜寵">青春甜寵</button>
                <button onclick="setGenreFilter('重生復仇')" class="genre-pill px-3 py-1 text-xs rounded-full border border-slate-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-900 text-slate-700 dark:text-zinc-300 whitespace-nowrap" data-genre="重生復仇">重生復仇</button>
                <button onclick="setGenreFilter('校園生活')" class="genre-pill px-3 py-1 text-xs rounded-full border border-slate-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-900 text-slate-700 dark:text-zinc-300 whitespace-nowrap" data-genre="校園生活">校園生活</button>
                <button onclick="setGenreFilter('宮斗權臣')" class="genre-pill px-3 py-1 text-xs rounded-full border border-slate-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-900 text-slate-700 dark:text-zinc-300 whitespace-nowrap" data-genre="宮斗權臣">宮斗權臣</button>
                <button onclick="setGenreFilter('科幻末世')" class="genre-pill px-3 py-1 text-xs rounded-full border border-slate-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-900 text-slate-700 dark:text-zinc-300 whitespace-nowrap" data-genre="科幻末世">科幻末世</button>
                <button onclick="setGenreFilter('風水玄學')" class="genre-pill px-3 py-1 text-xs rounded-full border border-slate-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-900 text-slate-700 dark:text-zinc-300 whitespace-nowrap" data-genre="風水玄學">風水玄學</button>
                <button onclick="setGenreFilter('相互救贖')" class="genre-pill px-3 py-1 text-xs rounded-full border border-slate-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-900 text-slate-700 dark:text-zinc-300 whitespace-nowrap" data-genre="相互救贖">相互救贖</button>
                <button onclick="setGenreFilter('醫學治療')" class="genre-pill px-3 py-1 text-xs rounded-full border border-slate-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-900 text-slate-700 dark:text-zinc-300 whitespace-nowrap" data-genre="醫學治療">醫學治療</button>
            </div>
        </section>

        <!-- Display Area -->
        <section id="novelsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></section>

        <div id="emptyState" class="hidden py-16 text-center">
            <h3 class="text-lg font-bold text-slate-700 dark:text-zinc-300 mb-1">找不到相關的小說記錄</h3>
            <button onclick="resetFilters()" class="text-sm text-amber-800 dark:text-amber-400 underline font-medium">重置所有篩選條件</button>
        </div>
    </main>

    <!-- Modal Form -->
    <div id="novelModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4 overflow-y-auto">
        <div class="bg-white dark:bg-zinc-800 w-full max-w-2xl rounded-2xl shadow-2xl border border-slate-200 dark:border-zinc-700 overflow-hidden my-8">
            <div class="bg-amber-900 text-amber-50 px-6 py-4 flex items-center justify-between">
                <h3 id="modalTitle" class="font-bold text-lg flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-amber-400"></i>
                    <span>新增小說記錄</span>
                </h3>
                <button onclick="closeModal()" class="text-amber-200 hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="novelForm" onsubmit="saveNovel(event)" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                <input type="hidden" id="novelId">

                <!-- 貼上文字一鍵智抓區域 -->
                <div class="p-3 bg-amber-50 dark:bg-amber-950/40 rounded-xl border border-amber-200 dark:border-amber-800/60">
                    <label class="block text-xs font-bold text-amber-900 dark:text-amber-300 mb-1">
                        ⚡ 番茄/網文 簡介內文一鍵自動解析 (貼上內文後點擊)
                    </label>
                    <div class="flex gap-2">
                        <textarea id="smartPasteInput" rows="2" placeholder="直接在此貼上番茄小說的簡介、書名或任意介紹文字..." class="flex-1 px-3 py-1.5 bg-white dark:bg-zinc-900 border border-amber-300 dark:border-zinc-700 rounded-lg text-xs"></textarea>
                        <button type="button" onclick="autoParseText()" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-xs font-bold whitespace-nowrap">
                            一鍵智慧填寫
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold mb-1">書名 *</label>
                        <input type="text" id="formTitle" required placeholder="例如：難哄" class="w-full px-3 py-2 bg-slate-50 dark:bg-zinc-900 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">作者</label>
                        <input type="text" id="formAuthor" placeholder="例如：竹已" class="w-full px-3 py-2 bg-slate-50 dark:bg-zinc-900 border rounded-lg text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold mb-1">題材分類</label>
                        <select id="formGenre" class="w-full px-3 py-2 bg-slate-50 dark:bg-zinc-900 border rounded-lg text-sm">
                            <option value="青春甜寵">青春甜寵</option>
                            <option value="重生復仇">重生復仇</option>
                            <option value="校園生活">校園生活</option>
                            <option value="宮斗權臣">宮斗權臣</option>
                            <option value="科幻末世">科幻末世</option>
                            <option value="風水玄學">風水玄學</option>
                            <option value="相互救贖">相互救贖</option>
                            <option value="醫學治療">醫學治療</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">主角姓名</label>
                        <input type="text" id="formProtagonist" placeholder="例如：桑延、溫以凡" class="w-full px-3 py-2 bg-slate-50 dark:bg-zinc-900 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">閱讀狀態</label>
                        <select id="formStatus" class="w-full px-3 py-2 bg-slate-50 dark:bg-zinc-900 border rounded-lg text-sm">
                            <option value="追更中">🔥 追更中</option>
                            <option value="養肥中">🌱 養肥中</option>
                            <option value="已完結">✅ 已完結</option>
                            <option value="已棄坑">🛑 已棄坑</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold mb-1">閱讀進度</label>
                        <input type="text" id="formProgress" placeholder="例如：第 80 章" class="w-full px-3 py-2 bg-slate-50 dark:bg-zinc-900 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">個人評分 (1-5 星)</label>
                        <div class="flex items-center space-x-2 py-1.5">
                            <input type="range" id="formRating" min="1" max="5" step="0.5" value="4.5" oninput="document.getElementById('ratingDisplay').innerText = this.value" class="w-full accent-amber-600">
                            <span id="ratingDisplay" class="text-sm font-bold text-amber-600 w-8 text-right">4.5</span>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold mb-1">💡 一句話防忘記憶點</label>
                    <input type="text" id="formSummary" required placeholder="機智記者溫以凡與傲嬌深情霸總桑延合租相愛的甜寵故事" class="w-full px-3 py-2 bg-amber-50/50 dark:bg-zinc-900 border border-amber-200 rounded-lg text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold mb-1">關鍵劇情備忘</label>
                    <textarea id="formPlotMemory" rows="3" placeholder="記錄關鍵節點與高光劇情..." class="w-full px-3 py-2 bg-slate-50 dark:bg-zinc-900 border rounded-lg text-sm"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold mb-1">讀後感 / 避雷提醒</label>
                    <textarea id="formNotes" rows="2" placeholder="甜度超高，雙向奔赴無毒點..." class="w-full px-3 py-2 bg-slate-50 dark:bg-zinc-900 border rounded-lg text-sm"></textarea>
                </div>

                <div class="flex items-center justify-end space-x-3 pt-3 border-t">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-slate-600">取消</button>
                    <button type="submit" class="px-5 py-2 bg-amber-800 hover:bg-amber-900 text-white rounded-lg text-sm font-semibold shadow">儲存小說</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const SAMPLE_NOVELS = [
            {
                id: "sample-1",
                title: "難哄",
                author: "竹已",
                genre: "青春甜寵",
                protagonist: "桑延、溫以凡",
                status: "已完結",
                rating: 5.0,
                progress: "全書完結",
                summary: "機智冷艷記者溫以凡與傲嬌深情霸總桑延機緣巧合下合租，重逢並舊情復燃的甜寵故事。",
                plotMemory: "1. 溫以凡夢遊抱住桑延。\n2. 桑延多年暗戀真相揭曉。",
                notes: "極度推薦，男主桑延深情傲嬌典範。",
                updatedAt: new Date().toISOString()
            }
        ];

        let novels = [];
        let activeGenreFilter = 'ALL';
        let viewMode = 'grid';

        window.onload = function() {
            loadFromLocalStorage();
            renderApp();
        };

        function loadFromLocalStorage() {
            const data = localStorage.getItem('novel_tracker_data');
            if (data) {
                try { novels = JSON.parse(data); } catch (e) { novels = SAMPLE_NOVELS; }
            } else {
                novels = SAMPLE_NOVELS;
                saveToLocalStorage();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('novel_tracker_data', JSON.stringify(novels));
        }

        function renderApp() {
            document.getElementById('statTotal').innerText = novels.length;
            document.getElementById('statReading').innerText = novels.filter(n => n.status === '追更中').length;
            document.getElementById('statWaiting').innerText = novels.filter(n => n.status === '養肥中').length;
            document.getElementById('statCompleted').innerText = novels.filter(n => n.status === '已完結').length;
            renderNovels();
        }

        function setGenreFilter(genre) {
            activeGenreFilter = genre;
            document.querySelectorAll('.genre-pill').forEach(btn => {
                if (btn.dataset.genre === genre) {
                    btn.className = 'genre-pill px-3 py-1 text-xs rounded-full border border-amber-800 bg-amber-800 text-white font-medium whitespace-nowrap';
                } else {
                    btn.className = 'genre-pill px-3 py-1 text-xs rounded-full border border-slate-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-900 text-slate-700 dark:text-zinc-300 whitespace-nowrap';
                }
            });
            renderApp();
        }

        function getFilteredAndSortedNovels() {
            const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const sortBy = document.getElementById('sortBy').value;

            return novels.filter(novel => {
                const matchSearch = !searchTerm || 
                    novel.title.toLowerCase().includes(searchTerm) ||
                    (novel.author && novel.author.toLowerCase().includes(searchTerm)) ||
                    (novel.protagonist && novel.protagonist.toLowerCase().includes(searchTerm)) ||
                    (novel.summary && novel.summary.toLowerCase().includes(searchTerm));
                const matchGenre = activeGenreFilter === 'ALL' || novel.genre === activeGenreFilter;
                const matchStatus = statusFilter === 'ALL' || novel.status === statusFilter;
                return matchSearch && matchGenre && matchStatus;
            }).sort((a, b) => b.rating - a.rating);
        }

        function renderNovels() {
            const container = document.getElementById('novelsContainer');
            const filteredList = getFilteredAndSortedNovels();
            if (filteredList.length === 0) {
                container.innerHTML = '';
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }
            document.getElementById('emptyState').classList.add('hidden');
            container.innerHTML = filteredList.map(novel => `
                <div class="bg-white dark:bg-zinc-800 p-5 rounded-xl border shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs px-2 py-0.5 rounded bg-amber-100 dark:bg-amber-900 text-amber-800 dark:text-amber-200 font-bold">${novel.genre}</span>
                        <span class="text-xs text-amber-500 font-bold">★ ${novel.rating}</span>
                    </div>
                    <h3 class="font-bold text-lg mb-1">${escapeHTML(novel.title)}</h3>
                    <p class="text-xs text-slate-500 mb-2">作者: ${escapeHTML(novel.author || '未知')} | 主角: ${escapeHTML(novel.protagonist || '未知')}</p>
                    <p class="text-xs bg-amber-50 dark:bg-zinc-900 p-2.5 rounded border border-amber-100 dark:border-zinc-700 text-slate-700 dark:text-zinc-300">
                        💡 ${escapeHTML(novel.summary)}
                    </p>
                </div>
            `).join('');
        }

        // 自動解析貼入的文字 (免 API 快速抽取欄位)
        function autoParseText() {
            const text = document.getElementById('smartPasteInput').value.trim();
            if (!text) {
                alert('請先在輸入框貼上小說的簡介或介紹內文！');
                return;
            }

            // 1. 抓取書名
            const titleMatch = text.match(/《([^》]+)》/) || text.match(/書名[：:\s]*([^\n]+)/);
            if (titleMatch) document.getElementById('formTitle').value = titleMatch[1].trim();

            // 2. 抓取作者
            const authorMatch = text.match(/作者[：:\s]*([^\n\s]+)/);
            if (authorMatch) document.getElementById('formAuthor').value = authorMatch[1].trim();

            // 3. 抓取主角
            const protMatch = text.match(/(?:主角|主角是|男女主)[：:\s]*([^\n]+)/);
            if (protMatch) document.getElementById('formProtagonist').value = protMatch[1].trim();

            // 4. 匹配 8 大題材
            const genres = ['青春甜寵', '重生復仇', '校園生活', '宮斗權臣', '科幻末世', '風水玄學', '相互救贖', '醫學治療'];
            let matchedGenre = '青春甜寵';
            for (let g of genres) {
                if (text.includes(g) || (g === '青春甜寵' && (text.includes('甜寵') || text.includes('甜文')))) {
                    matchedGenre = g;
                    break;
                }
            }
            document.getElementById('formGenre').value = matchedGenre;

            // 5. 摘要
            document.getElementById('formSummary').value = text.slice(0, 80) + (text.length > 80 ? '...' : '');
        }

        function openModal() {
            document.getElementById('novelForm').reset();
            document.getElementById('novelId').value = '';
            document.getElementById('novelModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('novelModal').classList.add('hidden');
        }

        function saveNovel(e) {
            e.preventDefault();
            const newNovel = {
                id: 'novel-' + Date.now(),
                title: document.getElementById('formTitle').value.trim(),
                author: document.getElementById('formAuthor').value.trim(),
                genre: document.getElementById('formGenre').value,
                protagonist: document.getElementById('formProtagonist').value.trim(),
                status: document.getElementById('formStatus').value,
                progress: document.getElementById('formProgress').value.trim(),
                rating: parseFloat(document.getElementById('formRating').value),
                summary: document.getElementById('formSummary').value.trim(),
                plotMemory: document.getElementById('formPlotMemory').value.trim(),
                notes: document.getElementById('formNotes').value.trim(),
                updatedAt: new Date().toISOString()
            };
            novels.unshift(newNovel);
            saveToLocalStorage();
            closeModal();
            renderApp();
        }

        function escapeHTML(str) { return str ? str.replace(/[&<>'"]/g, '') : ''; }
    </script>
</body>
</html>
